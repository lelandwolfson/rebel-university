# Fly.io config. See DEPLOY.md.
# Exactly ONE machine: SQLite lives on its volume, and rate limits/sessions are in memory.
# Always deploy with --ha=false so Fly does not create a second machine with its own database.
app = "rebel-university"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  BASE_URL = "https://rebeluniversity.org"
  TRUST_PROXY = "true"
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "rebel_data"
  destination = "/data"
  snapshot_retention = 5 # Fly's default for new volumes; shorter is better for privacy

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # the app idles around 140 MB; 256 MB left too little headroom
